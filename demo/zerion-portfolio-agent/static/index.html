<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scout portfolio demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-text">
        <h1>Scout</h1>
        <p>
          Ask what one wallet owns and how it performed. Requests stop at
          preview.
        </p>
      </div>
    </div>
    <div class="topbar-badges">
      <span class="badge badge-readonly">Read-only</span>
      <span class="badge badge-fixture" id="source-badge">Fixture data</span>
    </div>
  </header>

  <main class="grid">
    <div class="col">
      <section class="card" id="snapshot-card">
        <div class="card-head"><h2>Snapshot</h2></div>
        <div class="card-body" id="snapshot-body">
          <p class="loading">Loading&hellip;</p>
        </div>
      </section>

      <section class="card" id="pnl-card">
        <div class="card-head"><h2>PnL</h2></div>
        <div class="card-body" id="pnl-body">
          <p class="loading">Loading&hellip;</p>
        </div>
      </section>

      <section class="card" id="ta-card">
        <div class="card-head"><h2>Current signal</h2></div>
        <div class="card-body" id="ta-body">
          <p class="loading">Loading&hellip;</p>
        </div>
      </section>

      <section class="card" id="alerts-card">
        <div class="card-head"><h2>Alerts</h2></div>
        <div class="card-body" id="alerts-body">
          <p class="loading">Loading&hellip;</p>
        </div>
      </section>
    </div>

    <div class="col">
      <section class="card" id="dca-windows-card">
        <div class="card-head"><h2>DCA context</h2></div>
        <div class="card-body">
          <label class="risk-label" for="risk-profile-select">Sizing profile</label>
          <select id="risk-profile-select" aria-label="Risk profile">
            <option value="conservative">Conservative</option>
            <option value="balanced" selected>Balanced</option>
            <option value="aggressive">Aggressive</option>
          </select>
          <div id="dca-windows-body" class="card-body-inner">
            <p class="loading">Loading&hellip;</p>
          </div>
        </div>
      </section>

      <section class="card card-agent" id="dca-card">
        <div class="card-head"><h2>Ask for a plan, get a proposal.</h2></div>
        <div class="card-body">
          <form id="dca-form" autocomplete="off">
            <div class="input-row">
              <input
                id="dca-input"
                type="text"
                placeholder="e.g. DCA $300 of ETH weekly"
                aria-label="DCA request"
              />
              <button type="submit" id="dca-submit">Preview</button>
            </div>
          </form>
          <div class="chips">
            <button class="chip" data-example="DCA another $300 of ETH">
              $300 into ETH
            </button>
            <button
              class="chip"
              data-example="DCA $300 ETH on ethereum weekly from wallet:0xabc123 to wallet:0xdef456"
            >
              $300 ETH, weekly
            </button>
          </div>
          <div id="dca-result" class="dca-result"></div>
        </div>
      </section>

      <section class="card" id="report-card">
        <div class="card-head"><h2>Full report</h2></div>
        <div class="card-body">
          <a class="report-link" href="/api/report" target="_blank" rel="noopener">
            Open report
          </a>
        </div>
      </section>
    </div>
  </main>

  <footer class="safety-strip">
    <p>Analysis, not financial advice.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
