name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_judge:
        description: Run the opt-in AI Gateway judge
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e '.[test,quality,mcp]'
      - name: Ruff
        run: ruff check src scripts tests demo
      - name: Mypy
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Secret scan
        run: python scripts/security_scan.py .
      - name: Plugin manifest and README checks
        run: python scripts/check_plugin_manifest.py .
      - name: Checksum drift check
        run: python scripts/write_checksums.py --check
      - name: Documentation manifest drift check
        run: python scripts/gen_doc_manifest.py --check

  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Check lockfile
        run: uv lock --check
      - name: Install x402 contract dependencies
        run: python -m pip install -e '.[test,quality,mcp,x402]'
      - name: Exercise the real x402 SDK contract
        run: pytest -q tests/test_x402_source.py
      - name: Check generated Codex layout
        run: python scripts/build_host_layouts.py --check
      - name: Check release archive
        run: python scripts/build_release_zip.py --check

  offline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run fixture-backed honesty evals
        run: python scripts/scout_eval.py --offline

  live-judge:
    if: github.event_name == 'workflow_dispatch' && inputs.live_judge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run manually enabled AI Gateway judge
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "AI_GATEWAY_API_KEY is absent; skipping live judge."
            exit 0
          fi
          python scripts/scout_eval.py --judge
