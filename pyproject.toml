[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-portfolio-manager"
version = "0.7.1"
description = "Customizable onchain portfolio manager for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md", "LICENSE-STATUS.md"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3", "mcp>=1.2,<2"]
keywords = ["ai-agent", "mcp", "portfolio", "x402", "zerion"]

[project.urls]
Repository = "https://github.com/gabchess/scout-onchain"
Issues = "https://github.com/gabchess/scout-onchain/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
quality = ["ruff>=0.6,<1", "mypy>=1.11,<2"]
# Kept empty so older `[mcp]` install commands still resolve.
mcp = []
x402 = ["x402[requests,evm]>=2.22,<3", "eth-account>=0.13"]
# Documents the optional Hedwig preflight, not a package: enabling it needs a
# Node runtime and a built server from gabchess/hedwig, pinned commit
# 775e54f. Set HEDWIG_SERVER_PATH to that build's mcp/dist/server.js.
x402-hedwig = []

[project.scripts]
zpm-mcp = "scout_portfolio_manager.mcp_server:main"
scout-portfolio-manager = "scout_portfolio_manager.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scout_portfolio_manager = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.format]
# Frozen copy of the 0.6.1 DCA parser used for parity tests; never reformat.
exclude = ["tests/dca_v061.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
exclude = ["^tests/", "^build/"]
[[tool.mypy.overrides]]
module = ["scout_portfolio_manager.mcp_server"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["x402.*", "eth_account.*"]
ignore_missing_imports = true
follow_imports = "skip"
