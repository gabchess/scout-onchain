[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-portfolio-manager"
version = "0.3.3"
description = "Fixture-backed read-only portfolio intelligence"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
quality = ["ruff>=0.6,<1", "mypy>=1.11,<2"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
zpm-mcp = "scout_portfolio_manager.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scout_portfolio_manager = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "demo"]
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
exclude = ["^tests/", "^build/"]
[[tool.mypy.overrides]]
module = ["scout_portfolio_manager.mcp_server"]
ignore_missing_imports = true
