# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Public repo: keep this file free of private names and internal process.
# Inherit organization settings, with repository approval controls below.
inheritance: true
reviews:
  request_changes_workflow: true
  allow_author_approval: false
  auto_review:
    enabled: true
    drafts: false                       # a draft PR is reviewed once it is marked ready
    # Kept on: main requires one approving review and dismisses stale approvals on
    # push, so each new commit needs a fresh review before the approval can return.
    auto_incremental_review: true
    ignore_title_keywords:
      - "[WIP]"
      - "WIP:"
      - "DO NOT MERGE"
  path_filters:
    # shared block v1: narrative files and data logs. Same lines in every repo yaml.
    - "!**/handoffs/**"
    - "!**/*HANDOFF*.md"
    - "!**/PLAN-*.md"
    - "!docs/**/plans/**"
    - "!docs/**/specs/**"
    - "!docs/adr/**"
    - "!**/decisions/**"
    - "!**/*.jsonl"
    # this repo only
    - "!codex/**"                       # generated by scripts/build_host_layouts.py from skills/
    - "!evals/independent-defi/**"      # evidence records
    - "!component-notices/**"           # license and attribution text
    - "!THIRD-PARTY-NOTICES.md"
    - "!SHA256SUMS.txt"
    - "!RELEASE-MANIFEST.json"
    - "!LOADOUT-MANIFEST.json"
    - "!documentation-manifest.json"    # name matches scripts/gen_doc_manifest.py; not opened
    - "!docs/knowledge/SOURCE-LOCK.json"
    - "!src/scout_portfolio_manager/data/solana_glossary.json"  # imported by scripts/import_solana_glossary.py
    - "!src/scout_portfolio_manager/data/portfolio.json"        # synthetic, same as fixtures/
    - "!src/scout_portfolio_manager/data/price_history.json"    # synthetic, same as fixtures/
    - "!fixtures/**"
  path_instructions:
    - path: "src/scout_portfolio_manager/**/*.py"
      instructions: >
        Portfolio advisor that can prepare payments and swaps. Flag only: a path
        where proceed, approve, or sign is true while a guard verdict is deny or
        missing; a payment amount, recipient, or chain taken from untrusted text
        without the guard; a key or signer reachable from logs or exception
        messages; a network call with no timeout. State the exploit path in one
        sentence.
    - path: "src/scout_portfolio_manager/data/defi_knowledge.json"
      instructions: >
        Hand-written guidance text that ships in the package and goes to the
        agent at runtime. Flag only: a factual claim that is wrong or stale;
        text that reads as an instruction to the agent to skip a guard, approve,
        sign, or send funds; a link or address that looks unverified.
    - path: "skills/*/SKILL.md"
      instructions: >
        Flag only: frontmatter missing name or description; a description broad
        enough to trigger on unrelated requests; a referenced path, script, or
        flag that does not exist in the repo.
    - path: "tests/**/*.py"
      instructions: >
        Each new test must name the failure it catches and be able to fail.
        Flag only: a test that cannot fail (asserts a mock's own return, has no
        assertion); a test that swallows the error it should catch; an
        assertion that passes vacuously (empty loop or collection, always-true
        condition); a probabilistic lower bound on timing; a substring match
        that can hit the wrong symbol.
    - path: "**/*.md"
      instructions: >
        Flag only a number, date, path, version, or command that contradicts the
        code or another file. Skip wording, tone, and structure.
knowledge_base:
  learnings:
    scope: local
